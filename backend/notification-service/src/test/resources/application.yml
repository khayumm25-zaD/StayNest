spring:
  datasource:
    url: jdbc:h2:mem:notification-tests;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  cloud:
    discovery:
      enabled: false
eureka:
  client:
    enabled: false
jwt:
  secret: "test-only-notification-jwt-signing-secret-32-bytes"
