server:
  port: 8080
spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:5173}"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: property
          uri: lb://PROPERTY-SERVICE
          predicates:
            - Path=/api/properties/**
        - id: booking
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/api/bookings/**
        - id: payment
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**
        - id: review
          uri: lb://REVIEW-SERVICE
          predicates:
            - Path=/api/reviews/**
        - id: notification
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
