services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data, ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
  eureka-server:
    build: ./backend/eureka-server
    ports: ["8761:8761"]
  api-gateway:
    build: ./backend/api-gateway
    environment:
      FRONTEND_ORIGINS: "${FRONTEND_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports: ["8080:8080"]
    depends_on: [eureka-server]
  user-service:
    build: ./backend/user-service
    environment:
      DB_HOST: postgres
      DB_NAME: staynest_user
      DB_USERNAME: "${POSTGRES_USER:?Set POSTGRES_USER}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on: [postgres,eureka-server]
  property-service:
    build: ./backend/property-service
    environment:
      DB_HOST: postgres
      DB_NAME: staynest_property
      DB_USERNAME: "${POSTGRES_USER:?Set POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on: [postgres,eureka-server]
  booking-service:
    build: ./backend/booking-service
    environment:
      DB_HOST: postgres
      DB_NAME: staynest_booking
      DB_USERNAME: "${POSTGRES_USER:?Set POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      PAYMENT_SERVICE_API_KEY: "${PAYMENT_SERVICE_API_KEY:?Set PAYMENT_SERVICE_API_KEY}"
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on: [postgres,eureka-server]
  payment-service:
    build: ./backend/payment-service
    environment:
      DB_HOST: postgres
      DB_NAME: staynest_payment
      DB_USERNAME: "${POSTGRES_USER:?Set POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      PAYMENT_SERVICE_API_KEY: "${PAYMENT_SERVICE_API_KEY:?Set PAYMENT_SERVICE_API_KEY}"
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on: [postgres,eureka-server]
  review-service:
    build: ./backend/review-service
    environment:
      DB_HOST: postgres
      DB_NAME: staynest_review
      DB_USERNAME: "${POSTGRES_USER:?Set POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on: [postgres,eureka-server]
  notification-service:
    build: ./backend/notification-service
    environment:
      DB_HOST: postgres
      DB_NAME: staynest_notification
      DB_USERNAME: "${POSTGRES_USER:?Set POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on: [postgres,eureka-server]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    ports: ["3000:80"]
    depends_on: [api-gateway]
volumes:
  postgres_data:
